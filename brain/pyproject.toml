[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-brain"
version = "0.1.0"
description = "Evidence-first, headless research memory for agent clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Research Brain contributors" }]
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
openai = ["openai>=2"]
dev = ["pytest>=8", "httpx>=0.28"]
reviewer = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
research = "research_brain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_brain = ["store/migrations/*.sql", "reviewer_static/**/*", "reviewer_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
