[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpretability-pipeline"
version = "0.1.0"
description = "Offline, forward-only activation direction experiments"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.1", "torch==2.13.0", "transformers==5.14.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
interpret = "interp_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
