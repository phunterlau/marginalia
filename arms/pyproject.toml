[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-arms"
version = "0.1.0"
description = "Local scoped conversation routing for Research Brain"
requires-python = ">=3.11"
dependencies = ["research-brain>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
discord = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_arms = ["integrations/*.ts", "integrations/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
